name: Release CopyScreen Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Windows Portable Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --verbose

      - name: Build optimized release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package portable release asset
        shell: pwsh
        run: |
          $version = "${GITHUB_REF_NAME}"
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/copyscreen.exe" "dist/CopyScreen-${version}-portable-x64.exe"
          $hash = (Get-FileHash "dist/CopyScreen-${version}-portable-x64.exe" -Algorithm SHA256).Hash
          "$hash  CopyScreen-${version}-portable-x64.exe" | Set-Content "dist/CopyScreen-${version}-portable-x64.exe.sha256"

      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CopyScreen-*-portable-x64.exe
            dist/CopyScreen-*-portable-x64.exe.sha256
          generate_release_notes: true
