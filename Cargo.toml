[package]
name = "copyscreen"
version = "0.1.0"
edition = "2021"
authors = ["Davin"]
description = "Ultra-lightweight open-source Windows screen text extractor (Ctrl+Win+LeftClick) with instant glow overlay and drag-to-copy OCR."
license = "MIT"
repository = "https://github.com/Davinsry/CopyScreen"
readme = "README.md"
keywords = ["ocr", "screen-capture", "windows", "clipboard", "utility"]
categories = ["gui", "os::windows-apis", "command-line-utilities"]

[dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Foundation_Numerics",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
